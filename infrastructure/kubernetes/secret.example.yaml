# Copy to secret.yaml, fill in real values, and `kubectl apply -f secret.yaml`.
# Never commit the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: sre-agent-secrets
type: Opaque
stringData:
  SECRET_KEY: "replace-with-a-generated-django-secret-key"
  POSTGRES_PASSWORD: "replace-with-a-strong-password"
  LLM_API_KEY: "replace-with-a-real-api-key-if-using-a-non-mock-provider"
