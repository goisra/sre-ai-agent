apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sre-agent
spec:
  rules:
    - host: sre-agent.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sre-agent-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sre-agent-frontend
                port:
                  number: 3000
