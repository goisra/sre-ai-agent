apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-agent-config
data:
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  ALLOWED_HOSTS: "sre-agent.example.com"
  CORS_ALLOWED_ORIGINS: "https://sre-agent.example.com"
  POSTGRES_DB: "sre_agent"
  POSTGRES_USER: "sre_agent"
  POSTGRES_HOST: "sre-agent-postgres"
  POSTGRES_PORT: "5432"
  LLM_PROVIDER: "mock"
  LLM_MODEL: "gpt-4o-mini"
  PUBLIC_API_BASE_URL: "https://sre-agent.example.com"
