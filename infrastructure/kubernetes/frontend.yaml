apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-agent-frontend
  template:
    metadata:
      labels:
        app: sre-agent-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/sre-agent-frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: sre-agent-config
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sre-agent-frontend
spec:
  selector:
    app: sre-agent-frontend
  ports:
    - port: 3000
      targetPort: 3000
