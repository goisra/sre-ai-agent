[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agent-core"
version = "0.1.0"
description = "Framework-agnostic SRE agent core: tool-calling loop, tools, and LLM provider abstraction."
requires-python = ">=3.12"
dependencies = ["openai>=1.30,<2"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["frontend", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
